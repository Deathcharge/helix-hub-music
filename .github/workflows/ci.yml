name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check samsarix_workspace tests

      - name: Check formatting
        run: python -m ruff format --check samsarix_workspace tests

      - name: Type check
        run: python -m mypy samsarix_workspace

      - name: Test
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Check wheel contents
        run: python -c "import pathlib, zipfile; wheel=next(pathlib.Path('dist').glob('*.whl')); names=zipfile.ZipFile(wheel).namelist(); assert any(n.endswith('static/index.html') for n in names); print(wheel)"

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import samsarix_workspace; assert samsarix_workspace.__version__ == '0.1.0'"
          samsarix-workspace --version

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: samsarix-workspace-distributions
          path: dist/*
          if-no-files-found: error
