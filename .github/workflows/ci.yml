name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check samsarix_workspace tests e2e tools

      - name: Check formatting
        run: python -m ruff format --check samsarix_workspace tests e2e tools

      - name: Type check
        run: python -m mypy samsarix_workspace tools

      - name: Test
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Check wheel contents
        run: python -c "import pathlib, zipfile; wheel=next(pathlib.Path('dist').glob('*.whl')); names=zipfile.ZipFile(wheel).namelist(); assert any(n.endswith('static/index.html') for n in names); print(wheel)"

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          package_version="$(python -c "from importlib.metadata import version; print(version('samsarix-workspace'))")"
          smoke_directory="$(mktemp -d)"
          cd "$smoke_directory"
          python -c "from importlib.metadata import version; import samsarix_workspace; assert samsarix_workspace.__version__ == version('samsarix-workspace')"
          test "$(samsarix-workspace --version)" = "samsarix-workspace ${package_version}"

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samsarix-workspace-distributions
          path: dist/*
          if-no-files-found: error

      - name: Build and verify clean-runtime release evidence
        if: matrix.python == '3.13'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/release-tools"
          if [ "$RUNNER_OS" = "Windows" ]; then
            release_python="$RUNNER_TEMP/release-tools/Scripts/python.exe"
          else
            release_python="$RUNNER_TEMP/release-tools/bin/python"
          fi
          "$release_python" -m pip install -r tools/release-requirements.txt
          "$release_python" -I tools/release_evidence.py build "$RUNNER_TEMP/release-evidence"
          "$release_python" -I tools/release_evidence.py verify "$RUNNER_TEMP/release-evidence"

      - name: Upload unsigned release evidence
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.os }}-python${{ matrix.python }}
          path: ${{ runner.temp }}/release-evidence/*
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser ${{ matrix.browser }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser test tools
        run: python -m pip install -e ".[dev,browser]"
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Browser-to-disk acceptance tests
        working-directory: ${{ runner.temp }}
        env:
          SAMSARIX_TEST_INSTALLED: "1"
        run: python -m pytest "${{ github.workspace }}/e2e" -o addopts= --browser ${{ matrix.browser }} --tracing retain-on-failure --screenshot only-on-failure --output "${{ github.workspace }}/output/playwright/ci"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.os }}-${{ matrix.browser }}
          path: output/playwright/ci
          retention-days: 7
          if-no-files-found: ignore
